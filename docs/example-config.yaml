---
clusterName: sophos-cert-manager-loadtest

namespaces:
  # include:
  #   - production
  #   - platform
  exclude:
    - kube-system
    - kube-node-lease
    # - cert-manager

workloads:
  kinds:
    - Deployment
    - StatefulSet
    - DaemonSet
    - Job
    - CronJob

registry:
  resolveDigest: true

state:
  # Backend type: configmap (default), memory, or external.
  backend: configmap

  # Namespace containing the state ConfigMap.
  # Default is "default" if omitted.
  namespace: default

  # Expire stored scan state after this duration.
  # Default is 72h if omitted.
  ttl: 72h

  # memory backend settings (only used when backend: memory).
  # State is in-process only and will be lost on pod restart.
  memory:
    # Maximum number of live entries. 0 means unlimited.
    # Default: 1000
    maxEntries: 1000

  # external backend settings (only used when backend: external).
  # Requires a Redis-compatible server. No Kubernetes write permissions needed.
  # external:
  #   # Redis address in host:port form (required).
  #   address: redis:6379
  #
  #   # Optional Redis credentials.
  #   password: ""
  #   db: 0
  #
  #   # Enable TLS (e.g. for Redis with TLS termination or managed Redis services).
  #   tlsEnabled: false
  #
  #   # Key prefix applied to all Redis keys. Defaults to "komodor-security-reporter".
  #   keyPrefix: komodor-security-reporter
  #
  #   # Network timeouts.
  #   dialTimeout: 5s
  #   readTimeout: 3s
  #   writeTimeout: 3s

scanners:
  concurrency: 4
  scanners:
    - name: trivy
      type: trivy
      enabled: true
    # - name: snyk
    #   type: snyk
    #   enabled: true
    #   command:
    #     # Snyk requires CLI binary. Omit binary to use system PATH, or set absolute path.
    #     binary: /opt/homebrew/bin/snyk
    #     timeout: 5m
    # - name: wiz
    #   type: wiz
    #   enabled: false
    #   command:
    #     # Wiz requires CLI binary. Omit binary to use system PATH, or set absolute path.
    #     # binary: /opt/homebrew/bin/wizcli
    #     timeout: 5m
    # - name: clair
    #   type: clair
    #   enabled: false
    #   command:
    #     # Clair requires clairctl CLI. Omit binary to use system PATH, or set absolute path.
    #     # binary: /opt/homebrew/bin/clairctl
    #     timeout: 5m
    # - name: trivy-operator
    #   type: trivy-operator
    #   enabled: false
    #   resources:
    #     # Optional: choose Trivy Operator CRDs to ingest.
    #     - vulnerabilityreports
    #     # - clustervulnerabilityreports

publishing:
  # Publish mode: komodor, events, or both.
  mode: komodor
  minimumSeverity: high
  includeTopFindings: 5
  publishCleanScans: false
  dedupeTTL: 24h

komodor:
  baseURL: https://api.komodor.io
