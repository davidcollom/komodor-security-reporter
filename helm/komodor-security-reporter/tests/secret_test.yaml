suite: secret
templates:
  - templates/secret.yaml
tests:
  - it: creates a secret when createSecret is true and apiKey is set
    set:
      komodor.createSecret: true
      komodor.apiKey: test-api-key
      komodor.secretName: custom-komodor-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: custom-komodor-secret
      - equal:
          path: stringData.api-key
          value: test-api-key

  - it: does not create a secret when createSecret is false
    set:
      komodor.createSecret: false
    asserts:
      - hasDocuments:
          count: 0

  - it: fails templating when createSecret is true and apiKey is empty
    set:
      komodor.createSecret: true
      komodor.apiKey: ""
    asserts:
      - failedTemplate:
          errorMessage: "komodor.apiKey is required when komodor.createSecret=true"
