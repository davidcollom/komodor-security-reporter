{{- if .Values.komodor.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.komodor.secretName }}
  labels:
    {{- include "komodor-security-reporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "komodor.apiKey is required when komodor.createSecret=true" .Values.komodor.apiKey | quote }}
{{- end }}
