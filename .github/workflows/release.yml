name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump to apply from latest stable tag"
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - prerelease

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Verify actor is allowed by CODEOWNERS
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const coreOwnersPath = '.github/CODEOWNERS';

            if (!fs.existsSync(coreOwnersPath)) {
              core.setFailed('CODEOWNERS file is required for release dispatch gating.');
              return;
            }

            const actor = context.actor;
            const content = fs.readFileSync(coreOwnersPath, 'utf8');
            const lines = content
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter((line) => line && !line.startsWith('#'));

            const wildcardOwners = [];
            for (const line of lines) {
              const parts = line.split(/\s+/);
              if (parts.length < 2) {
                continue;
              }

              const pattern = parts[0];
              if (pattern !== '*') {
                continue;
              }

              for (const owner of parts.slice(1)) {
                if (owner.startsWith('@')) {
                  wildcardOwners.push(owner);
                }
              }
            }

            if (wildcardOwners.length === 0) {
              core.setFailed('No wildcard (*) owners found in CODEOWNERS. Add at least one repository owner to gate releases.');
              return;
            }

            const actorOwner = `@${actor}`;
            if (wildcardOwners.includes(actorOwner)) {
              core.info(`Actor ${actorOwner} is directly allowed by CODEOWNERS wildcard ownership.`);
              return;
            }

            const teamOwners = wildcardOwners.filter((owner) => owner.includes('/'));
            for (const owner of teamOwners) {
              const teamRef = owner.slice(1);
              const [org, teamSlug] = teamRef.split('/');

              if (!org || !teamSlug) {
                continue;
              }

              try {
                await github.request('GET /orgs/{org}/teams/{team_slug}/memberships/{username}', {
                  org,
                  team_slug: teamSlug,
                  username: actor,
                });

                core.info(`Actor @${actor} is a member of CODEOWNERS team ${owner}.`);
                return;
              } catch (err) {
                const status = err.status || 0;
                if (status !== 404) {
                  core.warning(`Unable to validate membership for ${owner}: ${err.message}`);
                }
              }
            }

            core.setFailed(`Actor @${actor} is not allowed to dispatch releases by CODEOWNERS wildcard owners: ${wildcardOwners.join(', ')}`);

      - name: Calculate next release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Using pushed tag: ${REF_NAME}"
            exit 0
          fi

          go install github.com/caarlos0/svu/v3@latest
          svu_cmd="$(go env GOPATH)/bin/svu"

          case "$BUMP" in
            major)
              base_tag="$($svu_cmd major)"
              ;;
            minor)
              base_tag="$($svu_cmd minor)"
              ;;
            patch)
              base_tag="$($svu_cmd patch)"
              ;;
            prerelease)
              base_tag="$($svu_cmd prerelease --prerelease=rc)"
              ;;
            *)
              echo "Unsupported bump: $BUMP" >&2
              exit 1
              ;;
          esac

          if [[ -z "$base_tag" ]]; then
            echo "Unable to calculate next base tag with svu" >&2
            exit 1
          fi

          base="${base_tag#v}"
          tag="v${base}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${tag}"

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Dispatch summary
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Created release tag: ${TAG}"
          echo "Release job will run in this workflow for ${TAG}."

  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for creating releases and uploading release assets
      packages: write # required for uploading release artifacts to GitHub Packages
      id-token: write # required for cosign keyless signing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.prepare-release.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"
